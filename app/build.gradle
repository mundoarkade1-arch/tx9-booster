plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.tx9booster'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.tx9booster"
        minSdk 21
        targetSdk 28
        versionCode 16
        versionName "0.6.0"
    }

    signingConfigs {
        proprio {
            def arquivo = System.getenv('TX9_KEYSTORE_ARQUIVO')
            def senha = System.getenv('TX9_KEYSTORE_SENHA')
            if (arquivo != null && senha != null) {
                storeFile file(arquivo)
                storePassword senha
                keyAlias 'tx9booster'
                keyPassword senha
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('TX9_KEYSTORE_ARQUIVO') != null) {
                signingConfig signingConfigs.proprio
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
