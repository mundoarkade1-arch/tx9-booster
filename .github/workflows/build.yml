name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Rodar os testes
        run: gradle testDebugUnitTest

  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar a chave de depuracao fixa
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar APK de depuracao
        run: gradle assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: tx9-booster-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Publicar Release
    needs: [testes, apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Baixar o APK compilado
        uses: actions/download-artifact@v4
        with:
          name: tx9-booster-debug
          path: apk-baixado

      - name: Criar a Release se ainda nao existir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSAO=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          if ! echo "$VERSAO" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Numero de versao invalido: $VERSAO"
            exit 1
          fi
          TAG="v$VERSAO"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A Release $TAG ja existe. Nada a fazer."
            exit 0
          fi
          cp apk-baixado/app-debug.apk "tx9-booster-$VERSAO.apk"
          gh release create "$TAG" "tx9-booster-$VERSAO.apk" \
            --title "TX9 Booster $VERSAO" \
            --notes "APK de depuracao da versao $VERSAO. Assinado com a chave publica de testes. Veja o CHANGELOG.md." \
            --target "$GITHUB_SHA"
